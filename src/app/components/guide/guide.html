<section class="faq-section">
    <div class="faq-header">
        <h2>{{ labels().guide.titlePrefix }} <span class="gradient-text">{{ labels().guide.titleHighlight }}</span></h2>
        <p>{{ labels().guide.subtitle }}</p>
    </div>

    <div class="faq-list">
        <div class="faq-item" *ngFor="let item of faqItems(); let i = index; trackBy: trackFaq" [class.open]="item.isOpen">
            <button class="faq-trigger" (click)="toggle(i)" [attr.aria-expanded]="item.isOpen" [attr.aria-controls]="'faq-body-' + i">
                <span class="faq-title">{{ item.title }}</span>
                <span class="faq-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round">
                         <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </span>
            </button>
            <div class="faq-body" [id]="'faq-body-' + i">
                <div class="faq-body-inner">
                    <div class="faq-content">
                        <p *ngIf="item.description">{{ item.description }}</p>
                        <ul *ngIf="item.points && item.points.length">
                            <li *ngFor="let point of item.points; trackBy: trackPoint">{{ point }}</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
