<section id="hero" class="pt-28 sm:pt-36 pb-16 bg-[#0a0a0a] min-h-[85vh] flex items-center">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 w-full">
    
    <!-- Hero Card Container -->
    <div class="bg-[#141414] border border-[#262626] rounded-2xl p-6 sm:p-10 lg:p-12 shadow-xl">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-center">
        
        <!-- Left / Hero Text Content -->
        <div class="lg:col-span-7 space-y-6 text-left rtl:text-right">
          
          <!-- Badge -->
          <div class="inline-flex items-center space-x-2 rtl:space-x-reverse px-3.5 py-1.5 rounded-full bg-[#0a0a0a] border border-[#262626] text-xs font-semibold text-[#a3a3a3]">
            <span class="w-2 h-2 rounded-full bg-[#f59e0b]"></span>
            <span>{{ labels().hero.badge }}</span>
          </div>

          <!-- Bold White Headline -->
          <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white leading-tight">
            {{ labels().hero.titlePrefix }}
            <span class="text-[#f59e0b] block mt-1">
              {{ labels().hero.titleHighlight }}
            </span>
          </h1>

          <!-- Clean Gray Sub-headline -->
          <p class="text-[#a3a3a3] text-base sm:text-lg font-normal leading-relaxed max-w-xl">
            {{ labels().hero.subtitle }}
          </p>

          <!-- Primary & Secondary Action CTAs -->
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-3 sm:space-y-0 sm:space-x-4 rtl:sm:space-x-reverse pt-2">
            <button 
              type="button" 
              (click)="onStartJourney()"
              class="bg-[#f59e0b] hover:bg-[#d97706] text-black font-bold px-8 py-3.5 rounded-xl transition-all inline-flex items-center justify-center shadow-lg text-center">
              {{ labels().hero.ctaPrimary }}
              <svg class="w-5 h-5 ml-2 rtl:ml-0 rtl:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </button>

            <button 
              type="button" 
              (click)="onViewResults()"
              class="bg-[#0a0a0a] hover:bg-[#1a1a1a] text-neutral-300 hover:text-white border border-[#262626] font-semibold px-7 py-3.5 rounded-xl transition-all inline-flex items-center justify-center">
              {{ labels().hero.ctaSecondary }}
            </button>
          </div>

          <!-- Clear 3-Column Stat Counter Grid -->
          <div class="grid grid-cols-3 gap-4 sm:gap-6 pt-6 border-t border-[#262626] w-full">
            <div>
              <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">500+</div>
              <div class="text-xs text-[#a3a3a3] mt-1 font-medium uppercase tracking-wider">{{ labels().hero.stat1 }}</div>
            </div>
            <div>
              <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">10+ Yrs</div>
              <div class="text-xs text-[#a3a3a3] mt-1 font-medium uppercase tracking-wider">{{ labels().hero.stat2 }}</div>
            </div>
            <div>
              <div class="text-2xl sm:text-3xl font-extrabold text-[#f59e0b] tracking-tight">98%</div>
              <div class="text-xs text-[#a3a3a3] mt-1 font-medium uppercase tracking-wider">{{ labels().hero.stat3 }}</div>
            </div>
          </div>

        </div>

        <!-- Right / Coach Image -->
        <div class="lg:col-span-5 flex justify-center">
          <div class="relative w-full max-w-sm aspect-[4/5] rounded-xl overflow-hidden border border-[#262626] bg-[#0a0a0a]">
            <img 
              src="https://res.cloudinary.com/dliuncsot/image/upload/v1782194344/instagram_square_v2_color_1080x1080_rzcu5m.png" 
              [alt]="labels().hero.coachAlt"
              class="w-full h-full object-cover object-center"
              loading="eager"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-[#141414] via-transparent to-transparent opacity-80"></div>
            
            <div class="absolute bottom-4 left-4 right-4 p-4 rounded-xl bg-[#0a0a0a]/90 backdrop-blur-md border border-[#262626] text-left rtl:text-right">
              <p class="text-xs uppercase tracking-wider text-[#f59e0b] font-bold">COACH ABOU SAMRA</p>
              <p class="text-xs text-[#a3a3a3] font-medium mt-0.5">Certified Fitness & Nutrition Specialist</p>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
