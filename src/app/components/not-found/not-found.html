<section class="not-found">
    <!-- Background glow blobs -->
    <div class="blob blob-left"></div>
    <div class="blob blob-right"></div>

    <!-- Coach image card -->
    <div class="coach-card">
        <div class="card-inner">
            <img src="https://images.unsplash.com/photo-1549476464-37392f717541?w=420&q=80&auto=format&fit=crop"
                [alt]="labels().notFound.imageAlt" class="coach-img" width="420" height="560" loading="lazy" decoding="async" />
        </div>
    </div>

    <!-- 404 text -->
    <h1 class="error-code">404</h1>

    <!-- Message -->
    <h2 class="error-title">{{ labels().notFound.title }}</h2>
    <p class="error-desc">
        {{ labels().notFound.descriptionLine1 }}<br />
        {{ labels().notFound.descriptionLine2 }}
    </p>

    <!-- CTA Buttons -->
    <div class="actions">
        <button class="btn btn-primary" (click)="goHome()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            {{ labels().notFound.home }}
        </button>

        <button class="btn btn-outline" (click)="viewPlans()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
            </svg>
            {{ labels().notFound.plans }}
        </button>
    </div>
</section>
